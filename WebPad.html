<!DOCTYPE html>
<html lang="ko" data-theme="light" data-pal="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebPad</title>
<style>
:root{--bg:#fbfbfa;--fg:#2b2b2b;--chrome:color-mix(in srgb,var(--bg) 92%,var(--fg));--chrome2:color-mix(in srgb,var(--bg) 86%,var(--fg));--border:color-mix(in srgb,var(--bg) 80%,var(--fg));--border2:color-mix(in srgb,var(--bg) 62%,var(--fg));--gfg:color-mix(in srgb,var(--bg) 45%,var(--fg));--hover:color-mix(in srgb,var(--bg) 84%,var(--fg));--sel:rgba(59,142,234,.35);--accent:#0e639c;--strip:#e8912d;--ui:"Segoe UI",Tahoma,"Malgun Gothic",sans-serif;--mono:Consolas,"Courier New",monospace;--fs:14px;--lh:21px;--tab:4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#1f1f1f;--fg:#d4d4d4;--sel:rgba(80,140,220,.4)}
:root[data-pal=light]{--c:#008000;--s:#a31515;--k:#0000ff;--n:#098658;--t:#267f99;--f:#795e26;--p:#af00db;--a:#e50000;--g:#800000}
:root[data-pal=dark]{--c:#6a9955;--s:#ce9178;--k:#569cd6;--n:#b5cea8;--t:#4ec9b0;--f:#dcdcaa;--p:#c586c0;--a:#9cdcfe;--g:#569cd6}
*{box-sizing:border-box;scrollbar-color:var(--border2) var(--chrome)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px var(--ui);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#menubar{display:flex;height:27px;padding:1px 2px;background:var(--chrome);border-bottom:1px solid var(--border);flex:none}
.menu{position:relative}
.menu>button{height:24px;padding:0 10px;background:none;border:1px solid transparent;color:inherit;font:inherit;cursor:default}
.menu>button:hover,.menu.open>button{background:var(--hover);border-color:var(--border2)}
.dd{display:none;position:absolute;top:24px;left:0;min-width:230px;background:var(--chrome);border:1px solid var(--border2);padding:2px;z-index:30}
.menu.open .dd{display:block}
.item{display:flex;justify-content:space-between;gap:24px;padding:4px 12px;cursor:default;white-space:nowrap}
.item:hover{background:var(--accent);color:#fff}
.sc{opacity:.65}
.sep{height:1px;margin:3px 2px;background:var(--border)}
#tabs{display:flex;height:29px;flex:none;background:var(--chrome2);border-bottom:1px solid var(--border2);overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;max-width:220px;border-right:1px solid var(--border2);border-top:3px solid transparent;color:var(--gfg);cursor:default;white-space:nowrap}
.tab.active{background:var(--bg);color:var(--fg);border-top-color:var(--strip)}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .x{width:16px;height:16px;line-height:15px;text-align:center}
.tab .x:hover{background:var(--hover)}
#findbar{display:none;flex:none;align-items:center;flex-wrap:wrap;gap:6px;padding:5px 8px;background:var(--chrome);border-bottom:1px solid var(--border)}
#findbar.show{display:flex}
input,select,button.b{height:23px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border2);border-radius:0;padding:0 6px}
button.b{background:var(--chrome);cursor:default}
button.b:hover{background:var(--hover)}
input[type=color]{padding:0;width:44px}
input[type=checkbox]{height:auto}
#editor{flex:1;min-height:0;display:flex}
#editor,#gut,#ta,#hl{font-family:var(--mono);font-size:var(--fs);line-height:var(--lh);tab-size:var(--tab)}
#gut{flex:none;overflow:hidden;padding:8px 8px 40px 10px;text-align:right;white-space:pre;background:var(--chrome);color:var(--gfg);border-right:1px solid var(--border2);user-select:none}
#wrap{flex:1;position:relative;min-width:0}
#ta,#hl{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:8px 12px;border:0;white-space:pre}
#hl{overflow:hidden;pointer-events:none;color:var(--fg)}
#ta{outline:0;resize:none;overflow:auto;background:transparent;color:transparent;caret-color:var(--fg)}
#ta::selection{background:var(--sel);color:transparent}
.t-c{color:var(--c);font-style:italic}.t-s{color:var(--s)}.t-k{color:var(--k)}.t-n{color:var(--n)}.t-t{color:var(--t)}.t-f{color:var(--f)}.t-p{color:var(--p)}.t-a{color:var(--a)}.t-g{color:var(--g)}
#status{display:flex;height:23px;flex:none;background:var(--chrome);border-top:1px solid var(--border2)}
.cell{padding:0 10px;line-height:22px;border-right:1px solid var(--border);white-space:nowrap}
.grow{flex:1}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:50}
#ov.show{display:flex}
#dlg{width:min(430px,94vw);background:var(--chrome);border:1px solid var(--border2)}
#dlg h3{margin:0;padding:5px 10px;font-size:13px;background:var(--hover);border-bottom:1px solid var(--border2)}
.rows{display:grid;grid-template-columns:120px 1fr;gap:10px 8px;align-items:center;padding:14px}
.rows select,.rows input[type=number]{width:100%}
.foot{display:flex;justify-content:flex-end;padding:0 14px 12px}
.foot .b{width:80px}
</style>
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="tabs"></div>
  <div id="findbar">
    <input id="fq" placeholder="Find" size="14"><input id="fr" placeholder="Replace" size="14">
    <label><input type="checkbox" id="fcase"> Aa</label>
    <button class="b" id="bn">Find Next</button><button class="b" id="bp">Prev</button>
    <button class="b" id="br">Replace</button><button class="b" id="ba">Replace All</button>
    <button class="b" id="bx">Close</button><span id="fmsg"></span>
  </div>
  <div id="editor">
    <div id="gut">1</div>
    <div id="wrap"><pre id="hl"></pre><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>
  </div>
  <div id="status">
    <span class="cell" id="s1"></span><span class="cell" id="s2"></span><span class="cell" id="s3"></span>
    <span class="cell grow"></span>
    <span class="cell" id="s4" style="cursor:default"></span><span class="cell">UTF-8</span><span class="cell" id="s5"></span>
  </div>
</div>
<div id="ov"><div id="dlg">
  <h3>Preferences</h3>
  <div class="rows">
    <label>Theme</label><select id="sth"><option value="light">Light</option><option value="dark">Dark</option><option value="custom">Custom</option></select>
    <label class="cr">Background</label><input type="color" id="sbg" class="cr">
    <label class="cr">Text color</label><input type="color" id="sfg" class="cr">
    <label>Language</label><select id="slang"></select>
    <label>Font size</label><input type="number" id="ssz" min="9" max="36">
    <label>Font family</label><select id="sff"></select>
    <label>Tab size</label><select id="stb"><option>2</option><option>4</option><option>8</option></select>
  </div>
  <div class="foot"><button class="b" id="sok">OK</button></div>
</div></div>
<input type="file" id="file" hidden>
<script>
const $=s=>document.querySelector(s);
const ta=$('#ta'),hl=$('#hl'),gut=$('#gut'),root=document.documentElement;
const LANGS={plaintext:'Plain Text',python:'Python',html:'HTML',javascript:'JavaScript',css:'CSS',c:'C',cpp:'C++',java:'Java'};
const EXT={py:'python',html:'html',htm:'html',js:'javascript',mjs:'javascript',css:'css',c:'c',h:'c',cpp:'cpp',cc:'cpp',cxx:'cpp',hpp:'cpp',java:'java'};
const FONTS={'Consolas':'Consolas','Courier New':'"Courier New"','Lucida Console':'"Lucida Console"','Menlo':'Menlo','D2Coding':'D2Coding','System Mono':'ui-monospace'};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- syntax highlighting ---------- */
const W=l=>'\\b(?:'+l.replace(/ /g,'|')+')\\b';
const CS=/"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?/.source;
const CC=/\/\/.*|\/\*[\s\S]*?(?:\*\/|(?![\s\S]))/.source;
const NUM=/\b(?:0[xX][\da-fA-F]+|\d+\.?\d*(?:[eE][+-]?\d+)?)[uUlLfF]*\b/.source;
const FN=/\b[A-Za-z_]\w*(?=\s*\()/.source;
const PP=/^[ \t]*#[ \t]*\w+[^\n]*/.source;
const G={};
function mk(l,r){G[l]={re:new RegExp(r.map(x=>'('+x[1]+')').join('|'),'gm'),cls:r.map(x=>x[0])}}
const CK='break case const continue default do else enum extern for goto if inline register restrict return sizeof static struct switch typedef union volatile while';
const CT='auto char double float int long short signed unsigned void bool size_t FILE NULL';
mk('c',[['c',CC],['p',PP],['s',CS],['n',NUM],['k',W(CK)],['t',W(CT)],['f',FN]]);
mk('cpp',[['c',CC],['p',PP],['s',CS],['n',NUM],['k',W(CK+' class public private protected namespace using template typename new delete this virtual override final try catch throw nullptr true false operator constexpr noexcept explicit friend mutable')],['t',W(CT+' string vector map set std cout cin endl unique_ptr shared_ptr')],['f',FN]]);
mk('java',[['c',CC],['s',CS],['p',/@\w+/.source],['n',NUM],['k',W('abstract assert break case catch class const continue default do else enum extends final finally for if implements import instanceof interface native new package private protected public return static super switch synchronized this throw throws try volatile while true false null var record')],['t',W('boolean byte char double float int long short void String Integer Double List Map Set Object System ArrayList HashMap')],['f',FN]]);
mk('javascript',[['c',CC],['s',CS+'|`(?:\\\\.|[^`\\\\])*`?'],['n',NUM],['k',W('break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new of return super switch this throw try typeof var void while with yield async await static get set true false null undefined')],['t',W('console document window Math JSON Array Object String Number Promise Map Set Date Boolean Error')],['f',FN]]);
mk('python',[['c',/#.*/.source],['s',/[rbfRBF]{0,2}(?:"""[\s\S]*?(?:"""|(?![\s\S]))|'''[\s\S]*?(?:'''|(?![\s\S]))|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)/.source],['p',/@[\w.]+/.source],['n',NUM],['k',W('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield None True False')],['t',W('print len range int str float list dict set tuple bool open type isinstance enumerate zip map filter sum min max abs sorted self cls')],['f',FN]]);
mk('css',[['c',/\/\*[\s\S]*?(?:\*\/|(?![\s\S]))/.source],['s',CS],['p',/@[\w-]+/.source],['n',/#[\da-fA-F]{3,8}\b|-?\b\d*\.?\d+(?:px|em|rem|%|vh|vw|vmin|vmax|ms|s|deg|fr|ch)?/.source],['t',/[.#][A-Za-z_][\w-]*/.source],['a',/[A-Za-z-]+(?=\s*:(?!:))/.source],['f',/[\w-]+(?=\()/.source]]);
function hiHtml(t){
  const re=/<!--[\s\S]*?(?:-->|(?![\s\S]))|<![^>]*>?|<\/?[A-Za-z][^>]*>?/g;let o='',l=0,m;
  while((m=re.exec(t))){
    o+=esc(t.slice(l,m.index));const s=m[0];
    if(s.startsWith('<!--'))o+='<span class="t-c">'+esc(s)+'</span>';
    else if(s.startsWith('<!'))o+='<span class="t-p">'+esc(s)+'</span>';
    else{const x=/^(<\/?)([\w:-]+)([\s\S]*?)(\/?>?)$/.exec(s);
      o+='<span class="t-g">'+esc(x[1]+x[2])+'</span>'+x[3].replace(/("[^"]*"?|'[^']*'?)|([\w:@.-]+)|([^"'\w:@.-]+)/g,(a,q,w)=>q?'<span class="t-s">'+esc(a)+'</span>':w?'<span class="t-a">'+esc(a)+'</span>':esc(a))+'<span class="t-g">'+esc(x[4])+'</span>';}
    l=re.lastIndex;
  }
  return o+esc(t.slice(l));
}
function hi(t,lang){
  if(lang==='html')return hiHtml(t);
  const g=G[lang];if(!g)return esc(t);
  let o='',l=0,m;g.re.lastIndex=0;
  while((m=g.re.exec(t))){
    if(!m[0]){g.re.lastIndex++;continue}
    o+=esc(t.slice(l,m.index));let k=1;while(m[k]===undefined)k++;
    o+='<span class="t-'+g.cls[k-1]+'">'+esc(m[0])+'</span>';l=m.index+m[0].length;
  }
  return o+esc(t.slice(l));
}

/* ---------- settings ---------- */
let S={theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',bg:'#f5f0e1',fg:'#333333',font:'Consolas',size:14,tab:4};
try{Object.assign(S,JSON.parse(localStorage.getItem('webpad')||'{}'))}catch(e){}
const lum=h=>(0.299*parseInt(h.slice(1,3),16)+0.587*parseInt(h.slice(3,5),16)+0.114*parseInt(h.slice(5,7),16))/255;
const LH=()=>Math.round(S.size*1.5);
function applyTheme(){
  let pal=S.theme;
  if(S.theme==='custom'){root.style.setProperty('--bg',S.bg);root.style.setProperty('--fg',S.fg);pal=lum(S.bg)<.5?'dark':'light'}
  else{root.style.removeProperty('--bg');root.style.removeProperty('--fg')}
  root.dataset.theme=S.theme;root.dataset.pal=pal;
  root.style.setProperty('--mono',FONTS[S.font]+',"Courier New",monospace');
  root.style.setProperty('--fs',S.size+'px');root.style.setProperty('--lh',LH()+'px');root.style.setProperty('--tab',S.tab);
  document.querySelectorAll('.cr').forEach(e=>e.style.display=S.theme==='custom'?'':'none');
  try{localStorage.setItem('webpad',JSON.stringify(S))}catch(e){}
  sync();
}

/* ---------- documents ---------- */
let docs=[],cur=0,lastN=0;
const doc=()=>docs[cur];
function newDoc(name,text,lang,named){docs.push({name,text,lang:lang||'plaintext',dirty:false,named:!!named});load(docs.length-1)}
function load(i){cur=i;ta.value=doc().text;ta.scrollTop=ta.scrollLeft=0;lastN=0;render();tabs();ta.focus()}
function render(){
  hl.innerHTML=hi(ta.value,doc().lang)+'\n ';
  const n=ta.value.split('\n').length;
  if(n!==lastN){lastN=n;gut.textContent=Array.from({length:n},(_,i)=>i+1).join('\n');gut.style.width='calc('+Math.max(3,String(n).length)+'ch + 20px)'}
  status();sync();
}
function sync(){hl.scrollTop=gut.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft}
function status(){
  const p=ta.selectionStart,b=ta.value.slice(0,p);
  $('#s1').textContent='Ln '+b.split('\n').length+', Col '+(p-b.lastIndexOf('\n'));
  $('#s2').textContent='Sel '+(ta.selectionEnd-p);
  $('#s3').textContent='Length '+ta.value.length+'  Lines '+lastN;
  $('#s4').textContent=LANGS[doc().lang];
  $('#s5').textContent='Spaces: '+S.tab;
  document.title=(doc().dirty?'* ':'')+doc().name+' - WebPad';
}
function tabs(){
  const t=$('#tabs');t.innerHTML='';
  docs.forEach((d,i)=>{
    const e=document.createElement('div');e.className='tab'+(i===cur?' active':'');
    e.innerHTML='<span class="nm">'+(d.dirty?'● ':'')+esc(d.name)+'</span><span class="x">×</span>';
    e.onclick=()=>{docs[cur].text=ta.value;load(i)};
    e.querySelector('.x').onclick=ev=>{ev.stopPropagation();closeTab(i)};
    t.appendChild(e);
  });
}
function closeTab(i=cur){
  if(docs[i].dirty&&!confirm('Close without saving?'))return;
  docs.splice(i,1);
  if(!docs.length){newDoc('untitled.txt','');return}
  load(Math.min(i<cur?cur-1:cur,docs.length-1));
}
const dtl=n=>EXT[(n.split('.').pop()||'').toLowerCase()]||'plaintext';
function openFiles(files){[...files].forEach(f=>{const r=new FileReader();r.onload=()=>{docs[cur]&&(docs[cur].text=ta.value);newDoc(f.name,r.result,dtl(f.name),true)};r.readAsText(f)})}
function dl(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'text/plain'}));a.download=doc().name;
  document.body.appendChild(a);a.click();a.remove();doc().dirty=false;doc().named=true;tabs();status();
}
function save(){doc().named?dl():saveAs()}
function saveAs(){const n=prompt('File name',doc().name);if(!n)return;doc().name=n;if(dtl(n)!=='plaintext')doc().lang=dtl(n);render();dl()}

/* ---------- editing ---------- */
const ex=(c,v)=>{ta.focus();document.execCommand(c,false,v)};
ta.addEventListener('input',()=>{const d=doc(),was=d.dirty;d.text=ta.value;d.dirty=true;render();if(!was)tabs()});
ta.addEventListener('scroll',sync);
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)status()});
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();ex('insertText',' '.repeat(S.tab))}
  else if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    const v=ta.value,p=ta.selectionStart,line=v.slice(v.lastIndexOf('\n',p-1)+1,p);let ind=line.match(/^[ \t]*/)[0];
    const l=doc().lang;if(l==='python'?/:\s*$/.test(line):(l!=='html'&&l!=='plaintext'&&/[{(\[]\s*$/.test(line)))ind+=' '.repeat(S.tab);
    e.preventDefault();ex('insertText','\n'+ind);
  }
});
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');ex('insertText',d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()))}

/* ---------- find / replace ---------- */
const fq=$('#fq'),fr=$('#fr');
function openFind(){$('#findbar').classList.add('show');const s=ta.value.slice(ta.selectionStart,ta.selectionEnd);if(s&&!s.includes('\n'))fq.value=s;fq.focus();fq.select()}
function pick(i,len){
  ta.focus();ta.setSelectionRange(i,i+len);
  const y=(ta.value.slice(0,i).split('\n').length-1)*LH();
  if(y<ta.scrollTop||y>ta.scrollTop+ta.clientHeight-LH()*2)ta.scrollTop=Math.max(0,y-ta.clientHeight/3);
  sync();status();
}
function findNext(back){
  const q=fq.value;if(!q)return false;const cs=$('#fcase').checked,h=cs?ta.value:ta.value.toLowerCase(),n=cs?q:q.toLowerCase();
  let i=back?h.lastIndexOf(n,ta.selectionStart-1):h.indexOf(n,ta.selectionEnd);
  if(i<0)i=back?h.lastIndexOf(n):h.indexOf(n);
  $('#fmsg').textContent=i<0?'Not found':'';
  if(i<0)return false;pick(i,q.length);return true;
}
function replaceOne(){
  const q=fq.value,s=ta.value.slice(ta.selectionStart,ta.selectionEnd);
  if(q&&(($('#fcase').checked?s:s.toLowerCase())===($('#fcase').checked?q:q.toLowerCase())))ex('insertText',fr.value);
  findNext();
}
function replaceAll(){
  const q=fq.value;if(!q)return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),$('#fcase').checked?'g':'gi');let c=0;
  const out=ta.value.replace(re,()=>(c++,fr.value));
  if(c){ta.focus();ta.select();ex('insertText',out)}
  $('#fmsg').textContent=c+' replaced';
}
$('#bn').onclick=()=>findNext();$('#bp').onclick=()=>findNext(true);$('#br').onclick=replaceOne;$('#ba').onclick=replaceAll;
$('#bx').onclick=()=>{$('#findbar').classList.remove('show');ta.focus()};
fq.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();findNext(e.shiftKey)}});

/* ---------- menus ---------- */
const clip=()=>navigator.clipboard.readText().then(t=>ex('insertText',t)).catch(()=>alert('Use Ctrl+V to paste in this browser.'));
const MENUS={
  File:[['New','Alt+N',()=>newDoc('untitled.txt','')],['Open…','Ctrl+O',()=>$('#file').click()],['Save','Ctrl+S',save],['Save As…','',saveAs],'-',['Close Tab','Alt+W',()=>closeTab()]],
  Edit:[['Undo','Ctrl+Z',()=>ex('undo')],['Redo','Ctrl+Y',()=>ex('redo')],'-',['Cut','Ctrl+X',()=>ex('cut')],['Copy','Ctrl+C',()=>ex('copy')],['Paste','Ctrl+V',clip],['Select All','Ctrl+A',()=>{ta.focus();ta.select()}],'-',['Find / Replace…','Ctrl+F',openFind],['Find Next','F3',()=>findNext()],['Insert Date/Time','',stamp]],
  Settings:[['Preferences…','',openSettings],'-',['Light Theme','',()=>{S.theme='light';applyTheme()}],['Dark Theme','',()=>{S.theme='dark';applyTheme()}],['Custom Theme','',()=>{S.theme='custom';applyTheme()}]]
};
const closeMenus=()=>document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
Object.entries(MENUS).forEach(([name,items])=>{
  const m=document.createElement('div');m.className='menu';m.innerHTML='<button>'+name+'</button><div class="dd"></div>';
  const dd=m.querySelector('.dd');
  items.forEach(it=>{
    if(it==='-'){dd.insertAdjacentHTML('beforeend','<div class="sep"></div>');return}
    const d=document.createElement('div');d.className='item';d.innerHTML='<span>'+it[0]+'</span><span class="sc">'+it[1]+'</span>';
    d.onmousedown=e=>e.preventDefault();d.onclick=()=>{closeMenus();it[2]()};dd.appendChild(d);
  });
  const b=m.firstChild;
  b.onclick=e=>{const o=m.classList.contains('open');closeMenus();if(!o)m.classList.add('open');e.stopPropagation()};
  b.onmouseenter=()=>{if(document.querySelector('.menu.open')&&!m.classList.contains('open')){closeMenus();m.classList.add('open')}};
  $('#menubar').appendChild(m);
});
document.addEventListener('click',closeMenus);

/* ---------- settings dialog ---------- */
$('#slang').innerHTML=Object.entries(LANGS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
$('#sff').innerHTML=Object.keys(FONTS).map(k=>'<option>'+k+'</option>').join('');
function openSettings(){
  $('#sth').value=S.theme;$('#sbg').value=S.bg;$('#sfg').value=S.fg;$('#slang').value=doc().lang;
  $('#ssz').value=S.size;$('#sff').value=S.font;$('#stb').value=S.tab;$('#ov').classList.add('show');
}
const closeSettings=()=>{$('#ov').classList.remove('show');ta.focus()};
$('#sth').onchange=e=>{S.theme=e.target.value;applyTheme()};
$('#sbg').oninput=e=>{S.bg=e.target.value;applyTheme()};
$('#sfg').oninput=e=>{S.fg=e.target.value;applyTheme()};
$('#slang').onchange=e=>{doc().lang=e.target.value;render()};
$('#ssz').onchange=e=>{S.size=Math.min(36,Math.max(9,+e.target.value||14));e.target.value=S.size;applyTheme()};
$('#sff').onchange=e=>{S.font=e.target.value;applyTheme()};
$('#stb').onchange=e=>{S.tab=+e.target.value;applyTheme()};
$('#sok').onclick=closeSettings;
$('#ov').onmousedown=e=>{if(e.target.id==='ov')closeSettings()};
$('#s4').onclick=openSettings;

/* ---------- misc ---------- */
$('#file').onchange=e=>{openFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();openFiles(e.dataTransfer.files)});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.key==='Escape'){closeMenus();closeSettings()}
  else if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();save()}
  else if((e.ctrlKey||e.metaKey)&&k==='o'){e.preventDefault();$('#file').click()}
  else if((e.ctrlKey||e.metaKey)&&k==='f'){e.preventDefault();openFind()}
  else if(e.altKey&&k==='n'){e.preventDefault();newDoc('untitled.txt','')}
  else if(e.altKey&&k==='w'){e.preventDefault();closeTab()}
  else if(e.key==='F3'){e.preventDefault();findNext(e.shiftKey)}
});
applyTheme();
newDoc('welcome.js',['// Welcome to WebPad','// Settings > Preferences: theme, font, language','','function greet(name) {','    const msg = "Hello, " + name + "!";','    console.log(msg);','    return msg.length;','}','','greet("World");',''].join('\n'),'javascript');
</script>
